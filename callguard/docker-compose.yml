services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [bridge]
    volumes: ["./data:/data"]
    environment: {DB_PATH: /data/callguard.db}
  bridge:
    build: ./bridge
    ports: ["8081:8081"]
    environment:
      SYMPHONY_WEBHOOK_URL: ${SYMPHONY_WEBHOOK_URL:-}
